version: 2
updates:
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/benchmark"
      - "/integration/cors"
      - "/pubsub/redis"
    schedule:
      interval: "weekly"

  - package-ecosystem: "bun"
    directory: "/docs"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
