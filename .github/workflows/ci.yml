name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"

      - name: Test
        run: go test -race ./...

      - name: Coverage
        run: env COVER_MIN=90 ./scripts/cover-lib.sh

      - name: Set up Go for Redis module
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: pubsub/redis/go.mod
          cache-dependency-path: pubsub/redis/go.sum

      - name: Test Redis module
        working-directory: pubsub/redis
        run: go test -race -coverprofile=/tmp/grx-redis-coverage.out ./...

      - name: Set up Go for CORS integrations
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: integration/cors/go.mod
          cache-dependency-path: integration/cors/go.sum

      - name: Test external CORS integrations
        working-directory: integration/cors
        run: go test -race ./...
