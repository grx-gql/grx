name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25"

      - name: Test
        run: go test -race ./...

      - name: Test Redis module
        working-directory: pubsub/redis
        run: go test -race -coverprofile=/tmp/grx-redis-coverage.out ./...

      - name: Coverage
        run: env COVER_MIN=90 ./scripts/cover-lib.sh

      - name: Set up Go for CORS integrations
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: integration/cors/go.mod
          cache-dependency-path: integration/cors/go.sum

      - name: Test external CORS integrations
        working-directory: integration/cors
        run: go test -race ./...
